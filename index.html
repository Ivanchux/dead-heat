<script>
"use strict";
/* ================= SIMULACIÓN (paso fijo, sin dibujo, con semilla) ================= */
const W = 21, H = 15, TILE = 32;
const T = { FLOOR: 0, ICE: 1, WALL: 2 }; // WALL = roca indestructible
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const DIR_LIST = ['up', 'left', 'down', 'right'];
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

function rng(seed) {
  let s = seed >>> 0;
  const f = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = n => Math.floor(f() * n);
  return f;
}

/* ---- Datos de niveles y enemigos (datos, no código) ---- */
const LEVELS = [
  { name: 'Primer deshielo', iceDensity: 0.30, enemies: ['chaser'], speed: 3.6, heatMax: 3, power: 2, refreeze: 14 },
  { name: 'Patinaje', iceDensity: 0.34, enemies: ['chaser', 'skater'], speed: 3.9, heatMax: 3, power: 2, refreeze: 12 },
  { name: 'Grietas', iceDensity: 0.38, enemies: ['chaser', 'skater', 'cracker'], speed: 4.2, heatMax: 4, power: 3, refreeze: 11 },
  { name: 'Cuarto frío', iceDensity: 0.42, enemies: ['chaser', 'skater', 'cracker', 'chaser'], speed: 4.5, heatMax: 4, power: 3, refreeze: 10 },
  { name: 'Calor muerto', iceDensity: 0.46, enemies: ['chaser', 'skater', 'cracker', 'skater', 'chaser'], speed: 4.8, heatMax: 5, power: 4, refreeze: 9 },
];
/* Modo clásico (estilo Pac-Man): sin hielo ni calor; fantasmas con personalidad y cuatro brasas grandes. */
const LEVELS_C = [
  { name: 'Primera ronda', iceDensity: 0.10, enemies: ['chaser', 'ambush'], speed: 3.4, heatMax: 0, power: 4, refreeze: 99 },
  { name: 'Segunda ronda', iceDensity: 0.10, enemies: ['chaser', 'ambush', 'shy'], speed: 3.7, heatMax: 0, power: 4, refreeze: 99 },
  { name: 'Tercera ronda', iceDensity: 0.14, enemies: ['chaser', 'ambush', 'shy', 'wander'], speed: 4.0, heatMax: 0, power: 4, refreeze: 99 },
  { name: 'Cuarta ronda', iceDensity: 0.14, enemies: ['chaser', 'ambush', 'shy', 'wander'], speed: 4.3, heatMax: 0, power: 4, refreeze: 99 },
  { name: 'Ronda final', iceDensity: 0.18, enemies: ['chaser', 'ambush', 'shy', 'wander', 'chaser'], speed: 4.6, heatMax: 0, power: 4, refreeze: 99 },
];
/* Modo bombas (estilo Bomberman): bloques de hielo que se rompen con bombas de calor. Gana quien elimina a todos. */
const LEVELS_B = [
  { name: 'Zona de pruebas', block: 0.48, enemies: ['chaser', 'wander', 'wander'], speed: 2.8, heatMax: 0, power: 0, refreeze: 99 },
  { name: 'Obras', block: 0.54, enemies: ['chaser', 'wander', 'wander', 'chaser'], speed: 3.0, heatMax: 0, power: 0, refreeze: 99 },
  { name: 'Almacén', block: 0.58, enemies: ['chaser', 'chaser', 'wander', 'wander'], speed: 3.2, heatMax: 0, power: 0, refreeze: 99 },
  { name: 'Fundición', block: 0.62, enemies: ['chaser', 'chaser', 'wander', 'chaser', 'wander'], speed: 3.4, heatMax: 0, power: 0, refreeze: 99 },
  { name: 'Reactor', block: 0.66, enemies: ['chaser', 'chaser', 'chaser', 'wander', 'wander'], speed: 3.6, heatMax: 0, power: 0, refreeze: 99 },
];
const MODES = ['deshielo', 'clasico', 'bombas'];
const MODE_NAMES = { deshielo: 'DESHIELO', clasico: 'CLÁSICO', bombas: 'BOMBAS' };
function levelDef(n, mode) {
  const L = mode === 'clasico' ? LEVELS_C : mode === 'bombas' ? LEVELS_B : LEVELS;
  if (n < L.length) return L[n];
  const b = L[L.length - 1], k = n - L.length + 1;
  const name = (mode === 'clasico' ? 'Ronda final ' : mode === 'bombas' ? 'Reactor ' : 'Calor muerto ') + (k + 1);
  return Object.assign({}, b, { name, speed: Math.min(mode === 'bombas' ? 4.6 : 6.2, b.speed + 0.25 * k), refreeze: Math.max(6, b.refreeze - k) });
}

/* ---- Generación del laberinto: simétrico, siempre conexo ---- */
function genBombs(seed, def) {
  const r = rng(seed), g = [], mid = (W - 1) / 2;
  for (let y = 0; y < H; y++) g.push(new Array(W).fill(T.WALL));
  for (let y = 1; y < H - 1; y++) for (let x = 1; x <= mid; x++) {
    if (x % 2 === 0 && y % 2 === 0) continue; // pilares fijos
    g[y][x] = r() < def.block ? T.ICE : T.FLOOR;
  }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < mid; x++) g[y][W - 1 - x] = g[y][x];
  // zona de salida despejada (esquina inferior izquierda) y su espejo
  for (const [x, y] of [[1, H - 2], [2, H - 2], [1, H - 3], [W - 2, H - 2], [W - 3, H - 2], [W - 2, H - 3]]) g[y][x] = T.FLOOR;
  return g;
}
function genMaze(seed, def, mode) {
  if (mode === 'bombas') return genBombs(seed, def);
  const g = genMazeBase(seed, def);
  if (mode === 'clasico') { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (g[y][x] === T.ICE) g[y][x] = T.WALL; carveConnected(g); }
  return g;
}
/* Sin hielo que derretir, el suelo aislado se une al resto abriendo muros interiores (en pareja, para conservar la simetría) */
function carveConnected(g) {
  const O = { grid: g };
  for (let guard = 0; guard < 120; guard++) {
    const seen = reachable(O, 1, H - 2);
    let lost = false;
    for (let y = 1; y < H - 1 && !lost; y++) for (let x = 1; x < W - 1; x++) if (g[y][x] === T.FLOOR && !seen[y * W + x]) { lost = true; break; }
    if (!lost) return;
    const prev = new Int16Array(W * H).fill(-2), q = [];
    for (let i = 0; i < W * H; i++) if (seen[i]) { prev[i] = -1; q.push(i); }
    let hit = -1;
    while (q.length && hit < 0) {
      const c = q.shift(), x = c % W, y = (c / W) | 0;
      for (const d of DIR_LIST) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (nx < 1 || ny < 1 || nx >= W - 1 || ny >= H - 1) continue;
        const n = ny * W + nx; if (prev[n] !== -2) continue;
        prev[n] = c;
        if (g[ny][nx] === T.FLOOR) { hit = n; break; }
        q.push(n);
      }
    }
    if (hit < 0) return;
    let c = prev[hit];
    while (c >= 0 && prev[c] !== -1) { const x = c % W, y = (c / W) | 0; g[y][x] = T.FLOOR; g[y][W - 1 - x] = T.FLOOR; c = prev[c]; }
  }
}
function genMazeBase(seed, def) {
  const r = rng(seed);
  const g = [];
  for (let y = 0; y < H; y++) { g.push(new Array(W).fill(T.ICE)); }
  for (let x = 0; x < W; x++) { g[0][x] = T.WALL; g[H - 1][x] = T.WALL; }
  for (let y = 0; y < H; y++) { g[y][0] = T.WALL; g[y][W - 1] = T.WALL; }
  // Esqueleto de pasillos garantizado (árbol perfecto en celdas impares) y luego bucles
  const cw = (W - 1) / 2, ch = (H - 1) / 2; // 10 x 7 celdas
  const seen = new Set();
  const stack = [[0, 0]]; seen.add('0,0'); g[1][1] = T.FLOOR;
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const nb = [];
    for (const d of DIR_LIST) {
      const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
      if (nx >= 0 && ny >= 0 && nx < cw && ny < ch && !seen.has(nx + ',' + ny)) nb.push([nx, ny]);
    }
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny] = nb[r.int(nb.length)];
    g[cy * 2 + 1 + (ny - cy)][cx * 2 + 1 + (nx - cx)] = T.FLOOR;
    g[ny * 2 + 1][nx * 2 + 1] = T.FLOOR;
    seen.add(nx + ',' + ny); stack.push([nx, ny]);
  }
  // Bucles: abrir segmentos de hielo (más abiertos cuanto menor la densidad)
  const openChance = 0.62 - def.iceDensity * 0.75;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (g[y][x] === T.ICE && ((x % 2 === 1) !== (y % 2 === 1)) && r() < openChance) g[y][x] = T.FLOOR;
  }
  // Pilares: los cruces pares quedan como roca en unos pocos sitios (identidad visual)
  for (let y = 2; y < H - 1; y += 2) for (let x = 2; x < W - 1; x += 2) {
    g[y][x] = r() < 0.35 ? T.WALL : T.ICE;
  }
  // Simetría izquierda-derecha (laberinto de arcade)
  const mid = (W - 1) / 2;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < mid; x++) g[y][W - 1 - x] = g[y][x];
  return g;
}

/* ---- Estado de partida ---- */
function newGame(opts) {
  opts = opts || {};
  const G = {
    seed: opts.seed != null ? opts.seed : 1234,
    mode: opts.mode || 'deshielo',
    level: opts.level || 0,
    score: opts.score || 0,
    lives: opts.lives != null ? opts.lives : 3,
    tick: 0, time: 0,
    events: [], // para el dibujado y el audio
    over: false, won: false,
  };
  startLevel(G);
  return G;
}

function startLevel(G) {
  const def = levelDef(G.level, G.mode);
  G.def = def;
  G.rand = rng(G.seed + G.level * 7919);
  G.grid = genMaze(G.seed + G.level * 104729, def, G.mode);
  G.water = []; // nivel de agua por casilla (0..1)
  G.thaw = []; // temporizador de recongelado de huecos abiertos por calor (ms)
  for (let y = 0; y < H; y++) { G.water.push(new Float32Array(W)); G.thaw.push(new Float32Array(W)); }
  G.embers = []; // mapa de brasas
  for (let y = 0; y < H; y++) G.embers.push(new Uint8Array(W));
  G.emberTotal = 0; G.emberLeft = 0;
  if (G.mode !== 'bombas') for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (G.grid[y][x] === T.FLOOR) { G.embers[y][x] = 1; G.emberTotal++; }
  }
  // Jugador al centro inferior; despejar una cruz de arranque
  const px = 1, py = H - 2;
  G.grid[py][px] = T.FLOOR; G.embers[py][px] = 0;
  const ps = G.pstats || { maxBombs: 1, range: 2, speed: 0 };
  G.player = { x: px, y: py, fx: px, fy: py, dir: 'right', want: 'right', t: 0, moving: false, heat: 0, dead: 0, inv: 0, maxBombs: ps.maxBombs, range: ps.range, speedUp: ps.speed };
  G.bombs = []; G.flames = []; G.items = [];
  // Brasas grandes (power-ups) en rincones lejanos
  G.powers = [];
  const spots = [[W - 2, 1], [1, 1], [W - 2, H - 2], [(W >> 1) | 1, (H >> 1) | 1], [W - 2, (H >> 1) | 1], [1, (H >> 1) | 1]];
  for (let i = 0; i < def.power && i < spots.length; i++) {
    const [sx, sy] = spots[i];
    if (G.grid[sy][sx] !== T.FLOOR && G.mode !== 'clasico') { G.grid[sy][sx] = T.FLOOR; }
    if (!(sx === px && sy === py)) { G.powers.push({ x: sx, y: sy }); if (G.embers[sy][sx]) { G.embers[sy][sx] = 0; G.emberTotal--; } }
  }
  // Conectar cualquier suelo aislado al mayor componente (red de seguridad)
  ensureConnected(G);
  G.emberLeft = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (G.embers[y][x]) G.emberLeft++;
  G.emberTotal = G.emberLeft;
  // Enemigos
  G.enemies = [];
  const corners = [[W - 2, 1], [W - 2, H - 2], [1, 1], [(W >> 1) | 1, 1], [(W >> 1) | 1, H - 2]];
  def.enemies.forEach((kind, i) => {
    const [ex, ey] = corners[i % corners.length];
    if (G.grid[ey][ex] !== T.FLOOR) G.grid[ey][ex] = T.FLOOR;
    if (G.mode === 'bombas') { const nx = ex + (ex < W / 2 ? 1 : -1), ny = ey + (ey < H / 2 ? 1 : -1); if (G.grid[ey][nx] === T.ICE) G.grid[ey][nx] = T.FLOOR; if (G.grid[ny][ex] === T.ICE) G.grid[ny][ex] = T.FLOOR; }
    G.enemies.push({ kind, x: ex, y: ey, fx: ex, fy: ey, dir: 'left', t: 0, moving: false, state: 'live', stun: 0, scared: 0, frozen: 0, stuck: 0, lastPos: ex + ',' + ey, home: [ex, ey], id: i, respawn: 0, crackCd: 5 + i * 2 });
  });
  G.powerTimer = 0;
  G.ready = 1.4; // cuenta atrás de "preparado"
  ensureConnected(G);
}

/* Marca el suelo alcanzable desde el jugador; lo que quede aislado se abre con un muro derretido mínimo */
function reachable(G, sx, sy) {
  const seen = new Uint8Array(W * H); const q = [[sx, sy]]; seen[sy * W + sx] = 1;
  while (q.length) {
    const [x, y] = q.shift();
    for (const d of DIR_LIST) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (G.grid[ny][nx] !== T.FLOOR || seen[ny * W + nx]) continue;
      seen[ny * W + nx] = 1; q.push([nx, ny]);
    }
  }
  return seen;
}
function ensureConnected(G) {
  if (G.mode === 'bombas') return; // el hielo se rompe con bombas
  // Une todas las zonas de suelo con la del jugador abriendo el camino de hielo más corto
  for (let guard = 0; guard < 80; guard++) {
    const seen = reachable(G, 1, H - 2);
    let anyLost = false;
    for (let y = 1; y < H - 1 && !anyLost; y++) for (let x = 1; x < W - 1; x++) if (G.grid[y][x] === T.FLOOR && !seen[y * W + x]) { anyLost = true; break; }
    if (!anyLost) return;
    // BFS multi-origen desde el suelo alcanzable, atravesando hielo, hasta tocar suelo aislado
    const prev = new Int16Array(W * H).fill(-2); const q = [];
    for (let i = 0; i < W * H; i++) if (seen[i]) { prev[i] = -1; q.push(i); }
    let hit = -1;
    while (q.length && hit < 0) {
      const c = q.shift(); const x = c % W, y = (c / W) | 0;
      for (const d of DIR_LIST) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (nx < 1 || ny < 1 || nx >= W - 1 || ny >= H - 1) continue;
        const n = ny * W + nx; if (prev[n] !== -2) continue;
        const t = G.grid[ny][nx]; if (t === T.WALL) continue;
        prev[n] = c;
        if (t === T.FLOOR) { hit = n; break; }
        q.push(n);
      }
    }
    if (hit < 0) return; // no debería ocurrir
    let c = prev[hit];
    while (c >= 0 && prev[c] !== -1) { const x = c % W, y = (c / W) | 0; if (G.grid[y][x] === T.ICE) G.grid[y][x] = T.FLOOR; c = prev[c]; }
  }
}

/* ---- Utilidades de movimiento ---- */
function passable(G, x, y, forEnemy) {
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  if (G.grid[y][x] !== T.FLOOR) return false;
  if (G.bombs) for (const b of G.bombs) if (b.x === x && b.y === y && !b.ghost) return false;
  return true;
}
function waterAt(G, x, y) { return G.water[y] ? G.water[y][x] : 0; }
function bfs(G, sx, sy, tx, ty) {
  // Devuelve la primera dirección del camino más corto, o null
  if (sx === tx && sy === ty) return null;
  const prev = new Int16Array(W * H).fill(-1); const q = [sy * W + sx]; prev[sy * W + sx] = sy * W + sx;
  while (q.length) {
    const c = q.shift(); const x = c % W, y = (c / W) | 0;
    if (x === tx && y === ty) break;
    for (const d of DIR_LIST) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (!passable(G, nx, ny)) continue;
      const n = ny * W + nx; if (prev[n] !== -1) continue;
      prev[n] = c; q.push(n);
    }
  }
  const goal = ty * W + tx; if (prev[goal] === -1) return null;
  let c = goal;
  while (prev[c] !== sy * W + sx) c = prev[c];
  const cx = c % W, cy = (c / W) | 0;
  for (const d of DIR_LIST) if (sx + DIRS[d][0] === cx && sy + DIRS[d][1] === cy) return d;
  return null;
}
function bfsDist(G, sx, sy) {
  const dist = new Int16Array(W * H).fill(-1); const q = [sy * W + sx]; dist[sy * W + sx] = 0;
  while (q.length) {
    const c = q.shift(); const x = c % W, y = (c / W) | 0;
    for (const d of DIR_LIST) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (!passable(G, nx, ny)) continue;
      const n = ny * W + nx; if (dist[n] !== -1) continue;
      dist[n] = dist[c] + 1; q.push(n);
    }
  }
  return dist;
}


/* ================= PASO DE SIMULACIÓN ================= */
const PLAYER_SPEED = 5.0;
const SCORE = { ember: 10, power: 50, eat: 200, evap: 400, clear: 500, life: 100, bomb: 300 };
const FUSE = 2.2, FLAME = 0.55;

function ev(G, type, x, y, extra) { G.events.push(Object.assign({ type, x, y }, extra || {})); }

function targetOf(e) { const d = DIRS[e.dir]; return [e.x + d[0], e.y + d[1]]; }
function updatePos(e) { const d = DIRS[e.dir]; e.fx = e.x + (e.moving ? d[0] * e.t : 0); e.fy = e.y + (e.moving ? d[1] * e.t : 0); }

function advance(G, e, speed, dt, onArrive) {
  if (!e.moving) return;
  e.t += speed * dt;
  while (e.t >= 1) {
    const d = DIRS[e.dir];
    e.x += d[0]; e.y += d[1]; e.t -= 1; e.moving = false;
    if (onArrive) onArrive(e);
    if (!e.moving && e.t > 0) { // sin nuevo movimiento: descartar el sobrante
      e.t = 0; break;
    }
  }
  updatePos(e);
}

function canFreeze(G, x, y) {
  if (G.grid[y][x] !== T.FLOOR) return false;
  if (G.embers[y][x]) return false;
  for (const p of G.powers) if (p.x === x && p.y === y) return false;
  const occupy = e => {
    if (e.x === x && e.y === y) return true;
    if (e.moving) { const t = targetOf(e); if (t[0] === x && t[1] === y) return true; }
    return false;
  };
  if (occupy(G.player)) return false;
  for (const e of G.enemies) if (e.state === 'live' && occupy(e)) return false;
  // conectividad: todo el suelo restante debe seguir siendo alcanzable desde el jugador
  G.grid[y][x] = T.ICE;

/* ---- Calor: derretir hielo ---- */

/* ---- Bombas de calor (modo bombas) ---- */

/* ---- Agua: flujo, evaporación y recongelado ---- */

      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];

/* ---- Jugador ---- */

    const w = p.want;

/* ---- Bucle principal ---- */

}

  p.x = 1; p.y = H - 2; p.fx = p.x; p.fy = p.y; p.moving = false; p.t = 0; p.dir = 'right'; p.want = 'right'; p.inv = 2;

  else for (const e of G.enemies) { if (e.state === 'live') { e.x = e.home[0]; e.y = e.home[1]; e.fx = e.x; e.fy = e.y; e.moving = false; e.t = 0; e.stun = 1.2; e.sliding = false; } }

function step(G, input, dt) {

  if (!G.cracks) G.cracks = [];
  if (G.ver == null) G.ver = 0;
  G.tick++;
  if (G.ready > 0) { G.ready -= dt; if (input && input.dir) G.player.want = input.dir; return; }
  G.time += dt;
  const p = G.player;
  if (p.dead > 0) {
    p.dead -= dt;
    if (p.dead <= 0) { if (G.lives < 0) { G.over = true; ev(G, 'gameover', p.x, p.y); } else respawnAll(G); }
    return;
  }
  if (p.inv > 0) p.inv -= dt;
  if (G.powerTimer > 0) { G.powerTimer -= dt; if (G.powerTimer <= 0) { G.powerTimer = 0; ev(G, 'powerend', 0, 0); } }
  if (input && input.act) { if (G.mode === 'bombas') placeBomb(G); else if (G.mode !== 'clasico') release(G); }

    if (e.state === 'live' && G.thaw[e.y] && G.thaw[e.y][e.x] > G.def.refreeze - 1.2 && G.water[e.y][e.x] > 0.1 && e.frozen <= 0) { e.frozen = 4; ev(G, 'chill', e.x, e.y); }
  }

  for (const e of G.enemies) {

    if (dx * dx + dy * dy < 0.38) {

    G.level++; G.won = G.level >= 999;

    // grietas anunciadas
    for (const k of G.cracks || []) {
      const X = px(k.x), Y = py(k.y); const blink = ((time * (10 + (1.3 - k.t) * 10)) | 0) % 2;
      c.fillStyle = blink ? '#ffffff' : '#e2406e';
      c.fillRect(X + 3, Y + 2, 2, 2); c.fillRect(X + 5, Y + 4, 2, 2); c.fillRect(X + 7, Y + 6, 2, 2); c.fillRect(X + 9, Y + 8, 2, 2); c.fillRect(X + 11, Y + 10, 2, 2);
      c.globalAlpha = 0.25; c.fillStyle = '#e2406e'; c.fillRect(X, Y, TS, TS); c.globalAlpha = 1;
    }
    // enemigos
    for (const e of G.enemies) {
      if (e.state !== 'live') continue;
      const scared = G.powerTimer > 0;
      const flash = scared && G.powerTimer < 2 && (Math.floor(time * 8) % 2 === 0);
      const pal = scared ? (flash ? SCARED_FLASH : SCARED_PAL) : ENEMY_PAL[e.kind];
      const wob = (e.kind === 'chaser' || e.kind === 'wander') ? Math.round(Math.sin(time * 8 + e.id)) : 0;
      const X = Math.round(e.fx * TS) + 2, Y = Math.round(HUD_H + e.fy * TS) + 2 + wob;
      const sk = SPR_KIND[e.kind] || e.kind;
      c.drawImage(spriteCanvas(sk, Object.assign({ H: pal.h }, pal), 0), X, Y);
      drawEyes(c, X, Y, 3, sk === 'skater' ? 3 : 4, e.dir, scared);
      if (e.frozen > 0) { c.globalAlpha = 0.6; c.fillStyle = PAL.ice0; c.fillRect(X - 1, Y - 1, 14, 14); c.globalAlpha = 1; c.fillStyle = PAL.ice2; c.fillRect(X - 1, Y - 1, 14, 1); c.fillRect(X - 1, Y + 12, 14, 1); c.fillRect(X - 1, Y - 1, 1, 14); c.fillRect(X + 12, Y - 1, 1, 14); }
      if (e.stun > 0) { c.fillStyle = '#fff6a0'; const a = time * 6; c.fillRect(X + 5 + Math.round(Math.cos(a) * 5), Y - 3 + Math.round(Math.sin(a) * 1), 2, 2); c.fillRect(X + 5 + Math.round(Math.cos(a + 3.14) * 5), Y - 3 + Math.round(Math.sin(a + 3.14) * 1), 2, 2); }
    }
    // jugador
    const p = G.player;
    if (p.dead <= 0 || p.dead > 1.1) {
      const blink = p.inv > 0 && (Math.floor(time * 14) % 2 === 0);
      if (!blink) {
        const bob = p.moving ? Math.round(Math.sin(time * 18)) : 0;
        const X = Math.round(p.fx * TS) + 2, Y = Math.round(HUD_H + p.fy * TS) + 2 + bob;
        c.drawImage(spriteCanvas('player', PLAYER_PAL, frame ? 2 : 0), X, Y);
        drawEyes(c, X, Y + 1, 3, 5, p.dir, false);
      }
    }
  }
  function drawEyes(c, X, Y, ex, ey, dir, scared) {
    const d = DIRS[dir] || [0, 0];
    c.fillStyle = scared ? '#ffffff' : '#fff7e6';
    c.fillRect(X + ex, Y + ey, 2, 2); c.fillRect(X + ex + 4, Y + ey, 2, 2);
    c.fillStyle = scared ? '#0a1c5a' : '#1a0a05';
    c.fillRect(X + ex + (d[0] > 0 ? 1 : 0), Y + ey + (d[1] > 0 ? 1 : 0), 1, 1);
    c.fillRect(X + ex + 4 + (d[0] > 0 ? 1 : 0), Y + ey + (d[1] > 0 ? 1 : 0), 1, 1);
  }

  /* ---- Luz aditiva ---- */
  function lights(c, G, time) {
    c.globalCompositeOperation = 'lighter';
    const p = G.player;
    if (p.dead <= 0) c.drawImage(glowSprite(34, 'rgba(255,140,40,0.40)'), Math.round(p.fx * TS + TS / 2 - 34), Math.round(HUD_H + p.fy * TS + TS / 2 - 34));
    for (const pw of G.powers) c.drawImage(glowSprite(20, 'rgba(255,190,60,0.5)'), px(pw.x) + TS / 2 - 20, py(pw.y) + TS / 2 - 20);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (G.embers[y][x]) c.drawImage(glowSprite(7, 'rgba(255,150,40,0.22)'), px(x) + 1, py(y) + 1);
    for (const b of G.bombs || []) c.drawImage(glowSprite(14, 'rgba(255,110,30,0.35)'), px(b.x) + TS / 2 - 14, py(b.y) + TS / 2 - 14);
    for (const f of G.flames || []) c.drawImage(glowSprite(18, 'rgba(255,160,40,0.55)'), px(f.x) + TS / 2 - 18, py(f.y) + TS / 2 - 18);
    for (const e of G.enemies) if (e.state === 'live') {
      const col = G.powerTimer > 0 ? 'rgba(80,120,255,0.28)' : (e.kind === 'chaser' ? 'rgba(160,90,255,0.26)' : e.kind === 'ambush' ? 'rgba(255,120,200,0.26)' : e.kind === 'shy' ? 'rgba(255,160,60,0.26)' : e.kind === 'wander' ? 'rgba(120,220,90,0.24)' : (e.kind === 'chaser' ? 'rgba(160,90,255,0.26)' : e.kind === 'skater' ? 'rgba(40,230,180,0.24)' : 'rgba(230,60,110,0.26)'));
      c.drawImage(glowSprite(18, col), Math.round(e.fx * TS + TS / 2 - 18), Math.round(HUD_H + e.fy * TS + TS / 2 - 18));
    }
    c.globalCompositeOperation = 'source-over';
  }

  /* ---- HUD ---- */
  function hud(c, G, hi, extra) {
    c.fillStyle = '#08101f'; c.fillRect(0, 0, VW, HUD_H);
    c.fillStyle = '#17304f'; c.fillRect(0, HUD_H - 1, VW, 1);
    drawText(c, 'PUNTOS', 6, 3, PAL.uiDim); drawText(c, String(G.score).padStart(6, '0'), 6, 9, PAL.ui, 2);
    drawText(c, 'NIVEL ' + (G.level + 1), VW / 2, 3, PAL.uiDim, 1, 'center');
    drawText(c, G.def.name, VW / 2, 10, PAL.ice1, 1, 'center');
    drawText(c, 'RÉCORD', VW - 6, 3, PAL.uiDim, 1, 'right'); drawText(c, String(Math.max(hi, G.score)).padStart(6, '0'), VW - 6, 10, PAL.uiHot, 1, 'right');
    // calor (solo deshielo); en bombas, bombas y alcance
    const p = G.player, max = G.mode === 'deshielo' ? G.def.heatMax : 0;
    if (G.mode === 'bombas') { drawText(c, 'BOMBAS ' + (p.maxBombs - G.bombs.length) + '/' + p.maxBombs + '  ALCANCE ' + p.range, 6, 22, PAL.uiDim, 1, 'left', false); }
    else if (G.mode === 'clasico') { drawText(c, 'BRASAS ' + G.emberLeft, 6, 22, PAL.uiDim, 1, 'left', false); }
    else drawText(c, 'CALOR', 6, 22, PAL.uiDim, 1, 'left', false);
    for (let i = 0; i < max; i++) {
      const x = 28 + i * 7; c.fillStyle = '#17304f'; c.fillRect(x, 22, 6, 5);
      if (i < p.heat) { c.fillStyle = PAL.flame1; c.fillRect(x, 22, 6, 5); c.fillStyle = PAL.flame3; c.fillRect(x, 22, 6, 1); }
      else if (i === Math.floor(p.heat)) { c.fillStyle = '#6a3a14'; c.fillRect(x, 22, Math.round(6 * ((p.acc || 0) / 5)), 5); }
    }
    // vidas
    const shown = Math.min(5, Math.max(0, G.lives));
    for (let i = 0; i < shown; i++) { c.drawImage(spriteCanvas('player', PLAYER_PAL, 0), VW - 14 - i * 11, 18, 8, 8); }
    if (G.lives > 5 && G.lives < 90) drawText(c, '+' + (G.lives - 5), VW - 14 - 5 * 11 + 6, 20, PAL.uiDim, 1, 'right', false);
    // temporizador de poder
    if (G.powerTimer > 0) { const w = Math.round(60 * G.powerTimer / 7); c.fillStyle = '#17304f'; c.fillRect(VW / 2 - 30, 23, 60, 3); c.fillStyle = '#6aa0ff'; c.fillRect(VW / 2 - 30, 23, w, 3); }
  }

  function post(c, G) {
    c.drawImage(getVignette(), 0, 0);
    if (!REDUCE && Particles.flash > 0) { c.globalAlpha = Math.min(0.5, Particles.flash * 0.45); c.fillStyle = '#ffe6b0'; c.fillRect(0, HUD_H, VW, VH - HUD_H); c.globalAlpha = 1; }
  }

  return { world, hud, lights, post, processEvents };
})();


/* ================= JUEGO: escenas, bucle, guardado ================= */
const Game = (() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  let scene = 'title', modeCur = 0, G = null, attract = null, hi = 0, newRecord = false, time = 0, acc = 0, last = 0, botMode = false, paused = false, menuIdx = 0;
  const FIXED = 1 / 60;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('deadheat.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('deadheat.' + k, JSON.stringify(v)); } catch (e) { } },
  };
  const hiKey = m => (m === 'deshielo' ? 'hi' : 'hi.' + m);
  let modeSel = store.get('mode', 'deshielo'); if (MODES.indexOf(modeSel) < 0) modeSel = 'deshielo';
  hi = store.get(hiKey(modeSel), 0);
  function setMode(m) { modeSel = m; store.set('mode', m); hi = store.get(hiKey(m), 0); newAttract(); }
  if (store.get('muted', false)) Audio_.toggleMute();

  function newAttract() { attract = newGame({ seed: (Math.random() * 1e6) | 0, level: (Math.random() * 3) | 0, lives: 99, mode: modeSel }); attract.ready = 0.2; }
  function startGame(opts) {
    Audio_.init(); Audio_.startMusic(); Audio_.play('start');
    G = newGame(Object.assign({ seed: (Math.random() * 1e6) | 0, mode: modeSel }, opts || {}));
    if (G.mode !== modeSel) { modeSel = G.mode; hi = store.get(hiKey(modeSel), 0); }
    scene = 'play'; newRecord = false; Particles.list.length = 0; Particles.floaters.length = 0;
  }
  function finish() {
    if (G.score > hi) { hi = G.score; newRecord = true; store.set(hiKey(G.mode), hi); }
    scene = 'over';
  }
  const ROW_Y = 64, ROW_H = 46, ROW_GAP = 6;
  function modeRowAt(y) { const i = Math.floor((y - ROW_Y) / (ROW_H + ROW_GAP)); return i >= 0 && i < MODES.length && (y - ROW_Y) - i * (ROW_H + ROW_GAP) <= ROW_H ? i : -1; }
  function chooseMode() { if (MODES[modeCur] !== modeSel) setMode(MODES[modeCur]); startGame(); }
  function stepAttract() {
    if (!attract || attract.over) newAttract();
    const lv = attract.level; step(attract, autoPilot(attract), FIXED); attract.events.length = 0;
    if (attract.level !== lv && attract.level > 4) newAttract();
    if (attract.mode === 'bombas' && attract.lives < 90) attract.lives = 99;
  }
  function dangerLevel(S) {
    let m = 99; const p = S.player;
    for (const e of S.enemies) if (e.state === 'live') m = Math.min(m, Math.hypot(e.fx - p.fx, e.fy - p.fy));
    return (S.powerTimer > 0 ? 0.3 : 0) + Math.max(0, 1 - m / 7) * 0.7 + Math.min(0.2, S.level * 0.04);
  }

  function update(inp) {
    if (inp.mute) { const m = Audio_.toggleMute(); store.set('muted', m); syncTools(); }
    if (scene === 'title') {
      if (inp.confirm) { scene = 'modes'; modeCur = MODES.indexOf(modeSel); Audio_.play('nope'); return; }
      stepAttract(); return;
    }
    if (scene === 'modes') {
      const md = inp.menuDir;
      if (md === 'up' || md === 'left') { modeCur = (modeCur + MODES.length - 1) % MODES.length; Audio_.play('nope'); return; }
      if (md === 'down' || md === 'right') { modeCur = (modeCur + 1) % MODES.length; Audio_.play('nope'); return; }
      if (inp.tap) { const r = modeRowAt(inp.tap[1]); if (r >= 0 && inp.tap[0] > 14 && inp.tap[0] < VW - 14) { modeCur = r; chooseMode(); return; } }
      if (inp.pause) { scene = 'title'; return; }
      if (inp.confirm) { chooseMode(); return; }
      stepAttract(); return;
    }
    if (scene === 'over') { if (inp.confirm) { scene = 'title'; newAttract(); } return; }
    if (scene === 'pause') { if (inp.pause || inp.confirm) { scene = 'play'; Audio_.startMusic(); } return; }
    if (scene === 'play') {
      if (inp.pause) { scene = 'pause'; return; }
      const input = botMode ? autoPilot(G, true) : { dir: inp.dir, act: inp.act };
      const lvBefore = G.level;
      step(G, input, FIXED);
      Render.processEvents(G);
      if (G.level !== lvBefore) { if (G.score > hi) { hi = G.score; store.set(hiKey(G.mode), hi); } }
      Audio_.setIntensity(dangerLevel(G));
      if (G.over) finish();
    }
  }

  function panel(c, lines, y0) {
    c.fillStyle = 'rgba(4,9,18,0.72)'; c.fillRect(0, y0 - 8, VW, lines.length * 12 + 14);
    lines.forEach((l, i) => drawText(c, l[0], VW / 2, y0 + i * 12, l[1] || PAL.ui, l[2] || 1, 'center'));
  }

  function draw() {
    const c = ctx;
    c.fillStyle = PAL.bg; c.fillRect(0, 0, VW, VH);
    const S = (scene === 'title' || scene === 'modes') ? (attract || newAttract() || attract) : G;
    const sh = REDUCE ? 0 : Particles.shake;
    c.save();
    if (sh > 0) c.translate(Math.round((Math.random() - 0.5) * sh * 6), Math.round((Math.random() - 0.5) * sh * 6));
    Render.world(c, S, time); Render.lights(c, S, time); Particles.draw(c); Particles.drawFloaters(c);
    c.restore();
    Render.hud(c, S, hi);
    Render.post(c, S);
    if (scene === 'title') {
      c.fillStyle = 'rgba(4,9,18,0.6)'; c.fillRect(0, HUD_H, VW, VH - HUD_H);
      const wob = Math.sin(time * 2) * 2;
      drawText(c, 'DEAD', VW / 2, 42 + wob, PAL.flame2, 7, 'center'); drawText(c, 'HEAT', VW / 2, 82 - wob, PAL.ice1, 7, 'center');
      drawText(c, 'EL LABERINTO SE DERRITE', VW / 2, 126, PAL.ui, 1, 'center');
      drawText(c, 'TRES MODOS: DESHIELO · CLÁSICO · BOMBAS', VW / 2, 140, PAL.uiDim, 1, 'center');
      if (Math.floor(time * 2) % 2 === 0) drawText(c, Input.device === 'táctil' ? 'TOCA PARA ELEGIR MODO' : 'PULSA ESPACIO O ENTER PARA ELEGIR MODO', VW / 2, 170, PAL.uiHot, 1, 'center');
      drawText(c, 'MOVER: FLECHAS / WASD / STICK / DESLIZAR', VW / 2, 198, PAL.uiDim, 1, 'center');
      drawText(c, 'CALOR O BOMBA: ESPACIO / A / TOQUE', VW / 2, 208, PAL.uiDim, 1, 'center');
      drawText(c, 'RÉCORD ' + String(hi).padStart(6, '0') + '  (' + MODE_NAMES[modeSel] + ')', VW / 2, 228, PAL.ice1, 1, 'center');
    } else if (scene === 'modes') {
      c.fillStyle = 'rgba(4,9,18,0.82)'; c.fillRect(0, HUD_H, VW, VH - HUD_H);
      drawText(c, 'ELIGE MODO', VW / 2, HUD_H + 10, PAL.flame2, 2, 'center');
      const INFO = {
        deshielo: ['EL ORIGINAL: RECOGE BRASAS Y USA EL CALOR', 'PARA DERRETIR EL HIELO Y CREAR AGUA'],
        clasico: ['SIN HIELO NI CALOR: COME TODAS LAS BRASAS', 'Y ESQUIVA A LOS FANTASMAS'],
        bombas: ['ROMPE EL HIELO CON BOMBAS DE CALOR', 'Y ELIMINA A TODOS LOS ENEMIGOS'],
      };
      MODES.forEach((m, i) => {
        const y = ROW_Y + i * (ROW_H + ROW_GAP), sel = i === modeCur;
        c.fillStyle = sel ? 'rgba(255,176,46,0.16)' : 'rgba(23,48,79,0.55)'; c.fillRect(14, y, VW - 28, ROW_H);
        c.fillStyle = sel ? PAL.flame2 : '#17304f'; c.fillRect(14, y, VW - 28, 1); c.fillRect(14, y + ROW_H - 1, VW - 28, 1); c.fillRect(14, y, 1, ROW_H); c.fillRect(VW - 15, y, 1, ROW_H);
        drawText(c, (sel ? '> ' : '  ') + MODE_NAMES[m], 24, y + 7, sel ? PAL.flame2 : PAL.ui, 2);
        drawText(c, 'RÉCORD ' + String(store.get(hiKey(m), 0)).padStart(6, '0'), VW - 24, y + 9, sel ? PAL.uiHot : PAL.uiDim, 1, 'right');
        drawText(c, INFO[m][0], 24, y + 26, sel ? PAL.ui : PAL.uiDim, 1);
        drawText(c, INFO[m][1], 24, y + 35, sel ? PAL.ui : PAL.uiDim, 1);
      });
      drawText(c, Input.device === 'táctil' ? 'TOCA UN MODO PARA JUGAR' : 'ARRIBA / ABAJO ELEGIR · ESPACIO JUGAR · ESC VOLVER', VW / 2, VH - 16, PAL.uiHot, 1, 'center');
    } else if (scene === 'play') {
      if (G.ready > 0) panel(c, [['NIVEL ' + (G.level + 1), PAL.ice1, 2], [G.def.name, PAL.ui], ['PREPARADO', PAL.uiHot]], HUD_H + 92);
    } else if (scene === 'pause') {
      panel(c, [['PAUSA', PAL.ice1, 3], ['P / ESC PARA SEGUIR · M: SONIDO ' + (Audio_.muted ? 'OFF' : 'ON'), PAL.uiDim]], HUD_H + 92);
    } else if (scene === 'over') {
      panel(c, [['FIN DEL JUEGO', PAL.danger, 2], ['PUNTOS ' + G.score, PAL.ui, 1], [newRecord ? 'NUEVO RÉCORD' : 'RÉCORD ' + hi, PAL.uiHot], ['PULSA ESPACIO', PAL.uiDim]], HUD_H + 78);
    }
  }

  function frame(ts) {
    const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; time += dt; acc += dt;
    const inp = Input.poll();
    let n = 0;
    while (acc >= FIXED && n < 6) {
      update(n === 0 ? inp : { dir: inp.dir, act: false, confirm: false, pause: false, mute: false });
      acc -= FIXED; n++;
    }
    if (n === 6) acc = 0;
    Particles.update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function fit() {
    const sw = innerWidth, sh = innerHeight; let k = Math.min(sw / VW, sh / VH);
    k = k >= 2 ? Math.floor(k) : k;
    cv.style.width = Math.floor(VW * k) + 'px'; cv.style.height = Math.floor(VH * k) + 'px';
  }
  addEventListener('resize', fit); fit();
  /* sonido y pantalla completa (botones y tecla F; también dentro de un iframe, como en itch.io) */
  const root = document.documentElement, fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const fsCan = () => { try { return !!((document.fullscreenEnabled || document.webkitFullscreenEnabled) && (root.requestFullscreen || root.webkitRequestFullscreen)); } catch (e) { return false; } };
  function toggleFs() {
    if (!fsCan()) return;
    try { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { const r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (r && r.catch) r.catch(() => {}); } } catch (e) { }
  }
  function toggleMuteNow() { const m = Audio_.toggleMute(); store.set('muted', m); syncTools(); }
  function syncTools() { const b = document.getElementById('btn-mute'), f = document.getElementById('btn-fs'); if (b) { b.style.opacity = Audio_.muted ? 0.45 : 1; b.setAttribute('aria-pressed', String(!!Audio_.muted)); } if (f) f.hidden = !fsCan(); }
  document.getElementById('btn-mute').addEventListener('click', e => { toggleMuteNow(); e.currentTarget.blur(); });
  document.getElementById('btn-fs').addEventListener('click', e => { toggleFs(); e.currentTarget.blur(); });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { syncTools(); fit(); }));
  addEventListener('keydown', e => { if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { toggleFs(); e.preventDefault(); } });
  syncTools();
  Input.bindTouch(cv); cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', () => Audio_.init(), { once: false });
  addEventListener('touchstart', () => Audio_.init(), { passive: true });
  addEventListener('pointerdown', () => Audio_.init());
  document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play') scene = 'pause'; });
  const qs = new URLSearchParams(location.search);
  if (qs.get('bot')) botMode = true;

  /* Interfaz para pruebas automáticas (no afecta al juego) */
  window.DH = {
    get scene() { return scene; }, get G() { return G || attract; }, get hi() { return hi; },
    start(o) { startGame(o); }, setBot(v) { botMode = !!v; },
    // avanza N pasos fijos sin depender de requestAnimationFrame y dibuja el último
    advance(n, opts) { opts = opts || {}; for (let i = 0; i < n; i++) { update(i === 0 && opts.inp ? opts.inp : { dir: null, act: false, confirm: false, pause: false, mute: false }); Particles.update(FIXED); time += FIXED; } draw(); },
    draw, scenes() { return scene; }, finish, autoPilot,
  };
  newAttract();
  requestAnimationFrame(frame);
  return { startGame };
})();
